language: ko-KR
tone_instructions: >-
  Write all reviews in 'Korean'.
  Speak like a colleague with clear technical details.
  Focus on code convention violations, security issues, bugs, and performance issues.
  Ignore formatting but check for typos or grammar errors.

early_access: true
enable_free_tier: true
reviews:
  profile: chill
  request_changes_workflow: true
  collapse_walkthrough: false
  high_level_summary: true
  high_level_summary_in_walkthrough: false
  changed_files_summary: true
  related_issues: true
  related_prs: true
  poem: false

  path_instructions:
    - path: "**/*.sql"
      instructions: If a table column name is "id" or ends with "_id", verify that the column type is "bigint".

  auto_review:
    enabled: true
    auto_incremental_review: true
    ignore_title_keywords:
      - "wip"
      - "draft"
    drafts: false
    base_branches:
      - "dev"

  finishing_touches:
    docstrings:
      enabled: true

knowledge_base:
  web_search:
    enabled: true
  code_guidelines:
    enabled: true
    filePatterns:
      - "**/README.md"
      - "**/REVIEW.md"

chat:
  auto_reply: true

code_generation:
  docstrings:
    language: "ko-KR"