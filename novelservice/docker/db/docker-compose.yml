services:
  db:
    image: mysql:8.4.7
    ports:
      - "22306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf
      - ./mysql/init:/docker-entrypoint-initdb.d
    environment:
      MYSQL_ROOT_PASSWORD: root123
      TZ: Asia/Seoul

volumes:
  mysql_data: