services:
  db:
    image: mysql:8.4.7
    container_name: db
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/my.cnf:/etc/mysql/conf.d/my.cnf
      - ./db/init:/docker-entrypoint-initdb.d
    environment:
      MYSQL_ROOT_PASSWORD: root123

  app:
    image: novel-service:local
    build:
      context: ../../
    container_name: app
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: novel_service
      DB_USERNAME: root
      DB_PASSWORD: root123
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  mysql_data: